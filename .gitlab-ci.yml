stages:
  - build
  - test

build_backend:
  stage: build
  tags:
    - local
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/

test_backend:
  stage: test
  tags:
    - local
  script:
    - ./gradlew test
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
      - build/test-results/test/