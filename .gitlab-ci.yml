stages:
  - build
  - test
  - quality
  - package
  - deploy

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

build_backend:
  stage: build
  tags:
    - local
  script:
    - .\gradlew.bat assemble --build-cache --no-daemon

test_backend:
  stage: test
  tags:
    - local
  script:
    - .\gradlew.bat clean test jacocoTestReport --build-cache --no-daemon
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
      - build/test-results/test/
      - build/reports/jacoco/test/
    expire_in: 3 months

sonarqube_backend:
  stage: quality
  tags:
    - local
  script:
    - .\gradlew.bat sonar --build-cache --no-daemon
  dependencies:
    - test_backend

package_backend:
  stage: package
  tags:
    - local
  script:
    - .\gradlew.bat bootJar --build-cache --no-daemon
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 3 months

deploy_backend:
  stage: deploy
  tags:
    - local
  script:
    - docker stop studyconnect-backend || exit 0
    - docker rm studyconnect-backend || exit 0
    - docker build -t studyconnect-backend .
    - docker run -d -p 8080:8080 --name studyconnect-backend studyconnect-backend
    - Start-Sleep -Seconds 20
    - docker ps
  dependencies:
    - package_backend
  only:
    - main