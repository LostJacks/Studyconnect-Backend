stages:
  - build
  - test

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

build_backend:
  stage: build
  tags:
    - local
  script:
    - .\gradlew.bat build -x test --build-cache --no-daemon
  artifacts:
    paths:
      - build/libs/

test_backend:
  stage: test
  tags:
    - local
  script:
    - .\gradlew.bat test --build-cache --no-daemon
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
      - build/test-results/test/