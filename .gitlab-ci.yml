stages:
  - build
  - test

build_backend:
  stage: build
  image: gradle:8.7-jdk17
  script:
    - chmod +x gradlew
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/

test_backend:
  stage: test
  image: gradle:8.7-jdk17
  script:
    - chmod +x gradlew
    - ./gradlew test
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
      - build/test-results/test/