stages:
  - build
  - test
  - package

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

build_backend:
  stage: build
  tags:
    - local
  script:
    - .\gradlew.bat assemble --build-cache --no-daemon

test_backend:
  stage: test
  tags:
    - local
  script:
    - .\gradlew.bat test --build-cache --no-daemon
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
      - build/test-results/test/

package_backend:
  stage: package
  tags:
    - local
  script:
    - .\gradlew.bat bootJar --build-cache --no-daemon
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week