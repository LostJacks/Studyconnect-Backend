stages:
  - build
  - test
  - package
  - deploy

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

build_backend:
  stage: build
  tags:
    - local
  script:
    - .\gradlew.bat assemble --build-cache --no-daemon

test_backend:
  stage: test
  tags:
    - local
  script:
    - .\gradlew.bat test --build-cache --no-daemon
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
      - build/test-results/test/

package_backend:
  stage: package
  tags:
    - local
  script:
    - .\gradlew.bat bootJar --build-cache --no-daemon
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

deploy_backend:
  stage: deploy
  tags:
    - local
  script:
    - if not exist deploy mkdir deploy
    - copy build\libs\*.jar deploy\
    - echo Backend jar copied to deploy folder
  dependencies:
    - package_backend
  only:
    - main