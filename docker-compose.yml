services:
  frontend:
    image: jackfxng03/studyconnect:frontend
    container_name: studyconnect-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    image: jackfxng03/studyconnect:backend
    container_name: studyconnect-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ezp87k.h.filess.io:3306/StudyConnect_monthactmy
      SPRING_DATASOURCE_USERNAME: StudyConnect_monthactmy
      SPRING_DATASOURCE_PASSWORD: your_filess_password
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_OPEN_IN_VIEW: "false"

  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    ports:
      - "9000:9000"