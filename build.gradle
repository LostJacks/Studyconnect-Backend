plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '7.2.3.7755'
}

group = 'com.studyconnect'
version = '0.0.1-SNAPSHOT'
description = 'StudyConnect Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	implementation 'org.springframework.security:spring-security-crypto'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
jacoco {
	toolVersion = "0.8.11"
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')

	reports {
		html.required.set(true)
		xml.required.set(true)
		csv.required.set(false)
	}
}

sonar {
	properties {
		property "sonar.projectKey", "StudyConnect"
		property "sonar.host.url", "http://localhost:9000"
		property "sonar.token", "sqp_e3721b524af4e77b43ef00160676eb055547e0ff"

		property "sonar.java.binaries", "build/classes"

		property "sonar.coverage.jacoco.xmlReportPaths",
				"build/reports/jacoco/test/jacocoTestReport.xml"

		property "sonar.coverage.exclusions",
				"**/data/repository/**," +
						"**/data/mapper/**," +
						"**/configuration/**," +
						"**/presentation/controller/**," +
						"**/presentation/dto/**," +
						"**/exceptions/**," +
						"**/domain/model/Skill.java," +
						"**/data/entity/**," +
						"**/StudyconnectApplication.java"
	}
}